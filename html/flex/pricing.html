<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .container {
      width: 50%;
      height: 470px;
      border: 2px solid black;
      display: flex;
      margin: 0 auto;
      justify-content: space-between;
      align-items: center;
      flex-direction: column;
      padding: 5px 5px;
      background-color: rgb(23, 2, 50);
    }

    .header-box {
      width: 80%;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      border: 2px solid black
    }

    .plans-container {
      width: 90%;
      border: 2px solid white;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    .item {
      width: 200px;
      height: 400px;
      border: 2px solid white;
      margin: 2px 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-weight: 5px;
      font-size: 40px;
    }


    #main-heading {
      color: antiquewhite;
      font-weight: 3px;
      font-family: sans-serif;
      word-spacing: .5em;
      letter-spacing: .3em;
    }

    #basic-item {
      background-color: rgb(64, 64, 210);
    }

    #pro-item {
      background-color: orange;
    }

    #ultimate-item {
      background-color: palevioletred
    }
  </style>

</head>

<body>
  <div class="container">
    <div class="header-box">
      <h1 id="main-heading">PRICING PLAN</h1>
    </div>


    <div class="plans-container">
      <div id="basic-item" class="item">
        <p>BASIC</p>
      </div>

      <div id="pro-item" class="item">
        <p>PRO</p>
      </div>

      <div id="ultimate-item" class="item">
        <p>PREMIUM</p>
      </div>
    </div>
  </div>
</body>

</html>
